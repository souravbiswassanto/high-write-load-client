apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-load-test-config-tls
  namespace: demo
data:
  # Database connection
  DB_HOST: "pg-ha-cluster.demo.svc"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  
  # SSL/TLS Configuration - Full Certificate Authentication
  SSL: "ON"
  DB_SSL_MODE: "verify-ca"
  CLIENT_AUTH_MODE: "cert"
  SSL_ROOT_CERT: "/tls/certs/ca.crt"
  SSL_CERT: "/tls/certs/tls.crt"
  SSL_KEY: "/tls/certs/tls.key"
  
  # Connection pool settings
  DB_MAX_OPEN_CONNS: "60"
  DB_MAX_IDLE_CONNS: "10"
  DB_MIN_FREE_CONNS: "5"
  
  # Load test configuration
  CONCURRENT_WRITERS: "100"
  TEST_RUN_DURATION: "1000"
  BATCH_SIZE: "100"
  REPORT_INTERVAL: "10"
  
  # Workload distribution
  INSERT_PERCENT: "60"
  UPDATE_PERCENT: "25"
  READ_PERCENT: "15"
  TABLE_NAME: "load_test_data"
  READ_BATCH_SIZE: "10"
