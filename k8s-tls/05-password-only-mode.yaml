apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-load-test-config-tls-password-only
  namespace: demo
data:
  # Database connection
  DB_HOST: "pg-ha-cluster.demo.svc"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  
  # SSL/TLS Configuration - Password-Only (no certificate verification)
  SSL: "ON"
  DB_SSL_MODE: "require"  # require encrypts but doesn't verify identity
  CLIENT_AUTH_MODE: "md5"  # or "scram"
  SSL_ROOT_CERT: ""
  SSL_CERT: ""
  SSL_KEY: ""
  
  # Connection pool settings
  DB_MAX_OPEN_CONNS: "60"
  DB_MAX_IDLE_CONNS: "10"
  DB_MIN_FREE_CONNS: "5"
  
  # Load test configuration
  CONCURRENT_WRITERS: "100"
  TEST_RUN_DURATION: "500"
  BATCH_SIZE: "100"
  REPORT_INTERVAL: "10"
  
  # Workload distribution
  INSERT_PERCENT: "60"
  UPDATE_PERCENT: "25"
  READ_PERCENT: "15"
  TABLE_NAME: "load_test_data"
  READ_BATCH_SIZE: "10"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-load-test-tls-password-only
  namespace: demo
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: pg-load-test-tls-password-only
    spec:
      restartPolicy: Never
      containers:
      - name: load-test
        image: souravbiswassanto/pg-load-test:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        envFrom:
        - configMapRef:
            name: pg-load-test-config-tls-password-only
        - secretRef:
            name: pg-load-test-secret-tls
        # No volume mounts needed - password authentication only
